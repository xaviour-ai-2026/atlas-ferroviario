<!doctype html>
<!-- Atlas Ferroviario — one full-screen geographic map of Spain: one search, one detail panel (route awareness). -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1524">
  <title>Atlas Ferroviario · Observatorio abierto del ferrocarril español</title>
  <meta name="description" content="Atlas Ferroviario, observatorio abierto del ferrocarril español: proyecto ciudadano, independiente, gratuito, sin ánimo de lucro y de código abierto por la transparencia ferroviaria, la concienciación pública y la investigación colaborativa. Datos abiertos de Renfe; no es un sistema de seguridad.">
  <link rel="stylesheet" href="/vendor/maplibre-gl-6.16.0/maplibre-gl.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="map" class="map" role="region" aria-label="Mapa de España con estaciones y trenes de Renfe"></div>

  <!-- Floating search -->
  <div class="search-panel">
    <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Atlas Ferroviario</p>
    <div class="search" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <label for="q" class="sr-only">Buscar estación o tren</label>
      <input id="q" type="search" placeholder="Buscar estación o tren" autocomplete="off" enterkeyhint="search"
        aria-controls="results" aria-expanded="false">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <ul id="results" class="results" role="listbox" aria-label="Resultados" hidden></ul>
  </div>

  <!-- Map controls -->
  <div class="controls">
    <button id="home" class="control" title="Ver toda España" aria-label="Ver toda España">España</button>
    <button id="overlay-toggle" class="control" aria-pressed="false" title="Capa detallada de vías de OpenRailwayMap">Vías</button>
    <button id="info-toggle" class="control" aria-label="Sobre este mapa y sus datos" title="Sobre este mapa">i</button>
  </div>

  <!-- Status chip: data freshness + coverage -->
  <p id="status" class="status" role="status" aria-live="polite">Cargando datos oficiales de Renfe…</p>

  <!-- Desktop: stop timeline of the selected train along the bottom of the map (Atlas-style) -->
  <nav id="timeline" class="timeline" aria-label="Paradas del tren seleccionado" hidden></nav>

  <!-- The one detail panel (right on desktop, bottom sheet on phones): a train, a station, or the information panel -->
  <aside id="card" class="sheet" aria-label="Detalle" hidden></aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
